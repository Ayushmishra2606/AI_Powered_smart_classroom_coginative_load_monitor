services:
  - type: web
    name: smart-classroom
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn -c gunicorn.conf.py app:app"
    healthCheckPath: /health
    
    # Environment Variables
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: classroom-db
          property: connectionString
      - key: SIMULATION_INTERVAL
        value: "3"
        
    # Disk (Requires Starter Plan - $7/mo)
    # disk:
    #   name: data-disk
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1

databases:
  - name: classroom-db
    plan: free
    region: oregon
